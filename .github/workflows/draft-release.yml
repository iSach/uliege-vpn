name: Draft release — requires manual publishing
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    name: Preview DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build-requirements.txt
      - name: Validate and test
        shell: bash
        run: |
          set -euo pipefail
          for script in build.sh install-helper.sh uninstall-helper.sh Packaging/create-dmg.sh Helper/*.sh Scripts/build-gof5.sh tests/run-native-tests.sh; do
            bash -n "$script"
          done
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          python3 -m unittest discover -s tests -v
          ./tests/run-native-tests.sh
          test "$(uname -m)" = '${{ matrix.arch }}'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build application and DMG
        shell: bash
        run: |
          INSTALL_APP=0 ./build.sh
          ./Packaging/create-dmg.sh
      - name: Local browser authentication fixtures
        shell: bash
        run: |
          build/.build-venv/bin/python -m playwright install chromium
          ULIEGE_REQUIRE_BROWSER_TESTS=1 build/.build-venv/bin/python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
  draft:
    name: Create a DRAFT GitHub release (not publicly published)
    runs-on: ubuntu-latest
    needs: [dmg]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-preview-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets are present
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && shasum -a 256 -c *.sha256)
          ls -lh release-assets/*.dmg release-assets/*.sha256
          test "$(find release-assets -name '*.dmg' | wc -l | tr -d ' ')" = 2
      - name: Create draft for maintainer approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/*.dmg release-assets/*.sha256 \
            --draft --prerelease --verify-tag --title "$TAG (unsigned preview)" \
            --notes-file RELEASE_NOTES.md
          echo 'Draft created. Review before manually publishing.'
